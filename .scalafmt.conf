version = "3.8.3"
runner.dialect = scala3
maxColumn = 120
preset = default
align.preset = more
align.multiline = true
danglingParentheses.preset = true
docstrings.style = Asterisk
newlines.source = keep

rewrite.rules = [
  RedundantBraces,
  SortModifiers,
  PreferCurlyFors
]

rewrite.redundantBraces.generalExpressions = false
rewrite.sortModifiers.order = [
  "implicit",
  "final",
  "sealed",
  "abstract",
  "override",
  "private",
  "protected"
]
